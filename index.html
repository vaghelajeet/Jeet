<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flower 🌸</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #12001f, #300052, #001d35);
      font-family: Arial, sans-serif;
    }

    .scene {
      position: relative;
      width: 350px;
      height: 500px;
    }

    /* Glow */
    .glow {
      position: absolute;
      width: 250px;
      height: 250px;
      top: 50px;
      left: 50px;
      border-radius: 50%;
      background: #ff4fd8;
      filter: blur(80px);
      opacity: 0.35;
      animation: glow 3s infinite alternate;
    }

    /* Flower */
    .flower {
      position: absolute;
      width: 180px;
      height: 180px;
      top: 100px;
      left: 85px;
      animation: float 4s ease-in-out infinite;
    }

    .petal {
      position: absolute;
      width: 90px;
      height: 140px;
      background: linear-gradient(135deg, #ff62dc, #8a2be2);
      border-radius: 50% 50% 45% 45%;
      left: 45px;
      top: 20px;
      transform-origin: 50% 90%;
      box-shadow: 0 0 25px #ff4fd8;
    }

    .petal:nth-child(1) {
      transform: rotate(0deg);
    }

    .petal:nth-child(2) {
      transform: rotate(72deg);
    }

    .petal:nth-child(3) {
      transform: rotate(144deg);
    }

    .petal:nth-child(4) {
      transform: rotate(216deg);
    }

    .petal:nth-child(5) {
      transform: rotate(288deg);
    }

    .center {
      position: absolute;
      width: 65px;
      height: 65px;
      left: 57px;
      top: 75px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff36b, #ff9f00);
      box-shadow: 0 0 30px #ffd000;
      z-index: 5;
    }

    /* Stem */
    .stem {
      position: absolute;
      width: 12px;
      height: 230px;
      background: linear-gradient(to right, #16c784, #58ff9c);
      top: 250px;
      left: 169px;
      border-radius: 20px;
      transform: rotate(2deg);
      box-shadow: 0 0 15px #20ff91;
    }

    /* Leaves */
    .leaf {
      position: absolute;
      width: 100px;
      height: 45px;
      background: linear-gradient(135deg, #22e889, #087f4b);
      border-radius: 100% 0 100% 0;
      box-shadow: 0 0 15px #16d879;
    }

    .leaf.left {
      top: 340px;
      left: 70px;
      transform: rotate(-25deg);
    }

    .leaf.right {
      top: 385px;
      left: 180px;
      transform: rotate(155deg);
    }

    /* Text */
    .title {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 28px;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #ff4fd8;
    }

    .subtitle {
      position: absolute;
      bottom: -10px;
      width: 100%;
      text-align: center;
      color: #dcbcff;
      font-size: 12px;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-15px) rotate(2deg);
      }
    }

    @keyframes glow {
      from {
        transform: scale(0.9);
        opacity: 0.25;
      }

      to {
        transform: scale(1.15);
        opacity: 0.5;
      }
    }
  </style>
</head>

<body>

  <div class="scene">

    <div class="glow"></div>

    <div class="flower">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>

      <div class="center"></div>
    </div>

    <div class="stem"></div>

    <div class="leaf left"></div>
    <div class="leaf right"></div>

    <div class="title">AI FLOWER</div>
    <div class="subtitle">Created with HTML & CSS</div>

  </div>

</body>
</html>
